<main style="padding: 2rem; font-family: system-ui, sans-serif;">
  <h1>Angular Demo</h1>
  <p>Selected: {{ selected() || 'None' }}</p>

  <sk-sidebar-menu brandTitle="SiteLedger" brandSubtitle="Local Angular Test" sectionLabel="Manage your workspace"
    variant="editorial" theme="auto" placement="right" [open]="isOpen()" [items]="items"
    (skOpenChange)="isOpen.set($event.detail)" (skItemSelect)="onSelect($event)" />


  <sk-bottom-dock theme="auto" [items]="dockItems" [activeId]="activeTab()" (skTabSelect)="onTabSelect($event)">
    <svg slot="icon-dashboard" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" />
      <rect x="14" y="3" width="7" height="7" />
      <rect x="14" y="14" width="7" height="7" />
      <rect x="3" y="14" width="7" height="7" />
    </svg>
    <svg slot="icon-materials" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path
        d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
    </svg>
    <svg slot="icon-transactions" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 3l4 4-4 4" />
      <path d="M20 7H4" />
      <path d="M8 21l-4-4 4-4" />
      <path d="M4 17h16" />
    </svg>
    <svg slot="icon-works" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 20h20" />
      <path d="M5 20V8l7-4 7 4v12" />
    </svg>
  </sk-bottom-dock>
</main>
